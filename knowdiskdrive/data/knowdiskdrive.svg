<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>KnowDiskDrive</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4551"/>
      <stop offset="1" stop-color="#232a33"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- 磁盘外壳 -->
  <rect x="10" y="18" width="108" height="92" rx="12" fill="url(#body)"/>
  <rect x="10" y="18" width="108" height="92" rx="12" fill="none" stroke="#12171d" stroke-width="2"/>

  <!-- 盘片 -->
  <circle cx="64" cy="64" r="34" fill="#2f3843" stroke="#1b2129" stroke-width="2"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#3f4a58" stroke-width="1.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="11" fill="#131920"/>
  <circle cx="64" cy="64" r="4" fill="#8fa1b7"/>

  <!-- 健康读数折线 -->
  <path d="M22 96 L36 96 L44 82 L52 96 L62 96 L70 88 L78 96 L92 96 L100 90 L106 96"
        fill="none" stroke="url(#pulse)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 状态指示灯 -->
  <circle cx="106" cy="30" r="7" fill="#22c55e"/>
</svg>
