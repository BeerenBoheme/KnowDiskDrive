[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowdiskdrive"
version = "0.0.2"
description = "Linux 桌面磁盘健康检测工具（CrystalDiskInfo 的替代品）"
readme = "README.md"
# config.py 用 tomllib（标准库，3.11 起才有）；3.10 靠 tomli 兜底，见 dependencies。
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KnowDiskDrive" }]
dependencies = [
    # PySide6 6.12.0 在 Python < 3.12 上会改坏 Qt 单例的引用计数（PYSIDE-3424 /
    # PYSIDE-3474），表现为退出时 Fatal Python error: none_dealloc: deallocating
    # None + SIGABRT。Python 3.10/3.11 必须留在 6.11.x，3.12 起才有正确轮子。
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
    "pyudev>=0.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# 打包成单个可执行文件（见 pack/ 目录与 README「在其他电脑上安装」）
build = ["pyinstaller>=6.3"]

[project.scripts]
knowdiskdrive = "knowdiskdrive.cli:main"
knowdiskdrive-gui = "knowdiskdrive.gui.app:main"

[tool.setuptools.packages.find]
include = ["knowdiskdrive*"]

[tool.setuptools.package-data]
# 菜单项与图标必须进 wheel，否则 pip 安装的机器上没有应用菜单入口。
"knowdiskdrive.data" = ["*.desktop", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
